name: Build Tent House Hisab APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          rm -rf project
          mkdir project
          unzip -o TentHouseHisab_Android_Project.zip -d project

      - name: Remove unnecessary AndroidX dependencies
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("project/app/build.gradle")
          text = p.read_text()

          start = text.find("dependencies {")
          if start != -1:
              end = text.find("}", start)
              if end != -1:
                  text = text[:start] + text[end + 1:]

          p.write_text(text)
          PY

      - name: Build Debug APK
        working-directory: project
        run: |
          gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tent-House-Hisab-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
